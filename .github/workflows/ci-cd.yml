name: MediCheck CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  # ══════════════════════════════════════════════════════════
  # SERVICE 2 — Bill Analysis API
  # NFR-23: runs on every PR and push to main
  # NFR-25: pytest, black, pylint
  # ══════════════════════════════════════════════════════════
  service2:
    name: Service 2 — Bill Analysis
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/service2-billanalysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install linting tools
        run: pip install black pylint pytest-cov

      - name: Black formatting check
        run: black --check .

      - name: Pylint
        run: pylint app.py config.py models.py extensions.py routes/ detectors/ services/ --fail-under=7.0 --disable=C0114,C0115,C0116,W0621,C0415

      - name: Run tests
        env:
          FLASK_ENV: development
          DATABASE_URL: sqlite:///test.db
          USE_MOCK_OCR: "true"
          SERVICE3_URL: http://localhost:5002
          SECRET_KEY: ci-test-secret
          MAX_FILE_SIZE_MB: "10"
          MAX_PAGE_COUNT: "20"
        run: pytest tests/ -v --tb=short --cov=. --cov-report=term-missing

  # ══════════════════════════════════════════════════════════
  # SERVICE 3 — RAG & Letter Service
  # Skips if service3-rag folder has no requirements.txt yet
  # ══════════════════════════════════════════════════════════
  service3:
    name: Service 3 — RAG & Letter
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/service3-rag

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if Service 3 exists
        id: check
        run: |
          if [ -f "requirements.txt" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python 3.11
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: pip install -r requirements.txt

      - name: Install linting tools
        if: steps.check.outputs.exists == 'true'
        run: pip install black pylint

      - name: Black formatting check
        if: steps.check.outputs.exists == 'true'
        run: black --check .

      - name: Pylint
        if: steps.check.outputs.exists == 'true'
        run: pylint app.py config.py routes/ rag/ --fail-under=7.0 --disable=C0114,C0115,C0116,W0621,C0415

      - name: Run tests
        if: steps.check.outputs.exists == 'true'
        env:
          FLASK_ENV: development
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SECRET_KEY: ci-test-secret
          CHROMA_PERSIST_DIR: ./chroma_db_test
        run: |
          if [ -d "tests" ] && [ "$(find tests -name '*.py' ! -name '__init__.py' | wc -l)" -gt 0 ]; then
            pytest tests/ -v --tb=short
          else
            echo "No tests found — skipping"
          fi

  # ══════════════════════════════════════════════════════════
  # SERVICE 1 — React Frontend
  # Skips if service1-frontend folder has no package.json yet
  # ══════════════════════════════════════════════════════════
  service1:
    name: Service 1 — React Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/service1-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if Service 1 exists
        id: check
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm install

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: npm run lint

      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: npm test

      - name: Build
        if: steps.check.outputs.exists == 'true'
        env:
          VITE_API_URL: https://medicheck-bill-analysis.onrender.com
        run: npm run build

  # ══════════════════════════════════════════════════════════
  # INTEGRATION — Service 2 × Service 3 end-to-end flow
  # Runs on push to main only — makes live OpenAI API calls.
  # Starts both services on localhost, runs real HTTP tests.
  # ══════════════════════════════════════════════════════════
  integration:
    name: Integration — Service 2 × Service 3
    runs-on: ubuntu-latest
    needs: [service2, service3]
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Service 3 dependencies
        working-directory: services/service3-rag
        run: pip install -r requirements.txt

      - name: Install Service 2 dependencies
        working-directory: services/service2-billanalysis
        run: pip install -r requirements.txt

      - name: Install integration test runner
        run: pip install pytest requests

      - name: Generate synthetic test bill PDF
        run: |
          python - <<'EOF'
          import os
          from reportlab.lib.pagesizes import letter
          from reportlab.platypus import SimpleDocTemplate, Paragraph
          from reportlab.lib.styles import getSampleStyleSheet
          os.makedirs("test-data/synthetic", exist_ok=True)
          for fname in ["test_bill.pdf", "test_eob.pdf"]:
              path = f"test-data/synthetic/{fname}"
              doc = SimpleDocTemplate(path, pagesize=letter)
              styles = getSampleStyleSheet()
              doc.build([Paragraph("MediCheck synthetic test document.", styles["Normal"])])
          print("Test PDFs generated.")
          EOF

      - name: Cache RAG knowledge base
        id: cache-chroma
        uses: actions/cache@v4
        with:
          path: services/service3-rag/data/chroma_db
          key: chroma-${{ hashFiles('services/service3-rag/data/raw/**') }}

      - name: Build RAG knowledge base
        if: steps.cache-chroma.outputs.cache-hit != 'true'
        working-directory: services/service3-rag
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python ingest.py

      - name: Start Service 3
        working-directory: services/service3-rag
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FLASK_ENV: development
          SECRET_KEY: ci-integration-secret
        run: nohup python app.py > /tmp/service3.log 2>&1 &

      - name: Wait for Service 3 to be ready
        run: |
          echo "Waiting for Service 3 to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5002/health > /dev/null 2>&1; then
              echo "Service 3 ready after ${i} attempts"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Service 3 failed to start. Log:"
              cat /tmp/service3.log
              exit 1
            fi
            sleep 5
          done

      - name: Start Service 2
        working-directory: services/service2-billanalysis
        env:
          FLASK_ENV: development
          SECRET_KEY: ci-integration-secret
          USE_MOCK_OCR: "true"
          SERVICE3_URL: http://localhost:5002
          SERVICE3_TIMEOUT_SECONDS: "60"
          DATABASE_URL: sqlite:///integration_test.db
          MAX_FILE_SIZE_MB: "10"
          MAX_PAGE_COUNT: "20"
        run: nohup python app.py > /tmp/service2.log 2>&1 &

      - name: Wait for Service 2 to be ready
        run: |
          echo "Waiting for Service 2..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5001/health > /dev/null 2>&1; then
              echo "Service 2 ready after ${i} attempts"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "Service 2 failed to start. Log:"
              cat /tmp/service2.log
              exit 1
            fi
            sleep 3
          done

      - name: Run integration tests
        env:
          SERVICE2_URL: http://localhost:5001
          SERVICE3_URL: http://localhost:5002
        run: pytest tests/integration/ -v --tb=short

  # ══════════════════════════════════════════════════════════
  # DEPLOY — only on push to main after all jobs pass
  # NFR-24: auto-deploy + health checks post-deploy
  # ══════════════════════════════════════════════════════════
  deploy:
    name: Deploy and Health Check
    runs-on: ubuntu-latest
    needs: [service2, service3, service1, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Service 2 to Render
        run: |
          curl -s -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE2_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'
          echo "Service 2 deploy triggered"

      - name: Deploy Service 3 to Render
        run: |
          curl -s -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE3_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'
          echo "Service 3 deploy triggered"

      - name: Wait for Render spin-up
        run: |
          echo "Sleeping 60s to allow Render services to spin up before health checks..."
          sleep 60

      - name: Health check Service 2
        run: |
          for i in 1 2 3; do
            body=$(curl -s https://medicheck-bill-analysis.onrender.com/health)
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              https://medicheck-bill-analysis.onrender.com/health)
            if [ "$response" = "200" ]; then
              echo "Service 2 health check PASSED - HTTP $response (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: HTTP $response — body: $body — retrying in 30s..."
            sleep 30
          done
          echo "Service 2 health check FAILED after 3 attempts"
          exit 1

      - name: Health check Service 3
        run: |
          echo "Waiting for Service 3 to be ready..."
          for i in $(seq 1 24); do
            body=$(curl -s https://medicheck-rag.onrender.com/health)
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              https://medicheck-rag.onrender.com/health)
            if [ "$response" = "200" ]; then
              echo "Service 3 health check PASSED - HTTP $response (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: HTTP $response — body: $body — retrying in 15s..."
            sleep 15
          done
          echo "Service 3 health check FAILED after 6 minutes"
          exit 1

      - name: Health check Service 1
        run: |
          for i in 1 2 3; do
            body=$(curl -s https://medicheck-frontend-i3rv.onrender.com/)
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              https://medicheck-frontend-i3rv.onrender.com/)
            if [ "$response" = "200" ]; then
              echo "Service 1 health check PASSED - HTTP $response (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: HTTP $response — body: $body — retrying in 30s..."
            sleep 30
          done
          echo "Service 1 health check FAILED after 3 attempts"
          exit 1